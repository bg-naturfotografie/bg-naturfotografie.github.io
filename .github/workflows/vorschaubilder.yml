# ============================================================
# Kleine Vorschaubilder automatisch erzeugen
# ============================================================
# Startet, sobald sich etwas im Ordner bilder/ ändert (z. B. nach
# einem Bild-Upload im Admin-Bereich), erzeugt die kleinen
# Fassungen in bilder/klein/ und veröffentlicht die Seite neu.
# Kostenlos, läuft komplett bei GitHub — kein fremder Dienst.
# Erklärung: werkzeuge/vorschaubilder.py
# ============================================================
name: Vorschaubilder erzeugen

on:
  push:
    branches: [main]
    paths:
      - 'bilder/**'
      - '!bilder/klein/**'
  workflow_dispatch:   # zusätzlich per Hand startbar (Actions → Run workflow)

concurrency:
  group: vorschaubilder
  cancel-in-progress: false

permissions:
  contents: write   # die kleinen Bilder zurückschreiben
  pages: write      # Webseite danach neu veröffentlichen

jobs:
  vorschaubilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pillow installieren
        run: python3 -m pip install --quiet pillow

      - name: Kleine Fassungen erzeugen
        run: python3 werkzeuge/vorschaubilder.py

      - name: Speichern
        id: speichern
        run: |
          git add bilder/klein
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Vorschaubild-Roboter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vorschaubilder aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "geaendert=ja" >> "$GITHUB_OUTPUT"

      - name: Webseite neu veröffentlichen
        if: steps.speichern.outputs.geaendert == 'ja'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
