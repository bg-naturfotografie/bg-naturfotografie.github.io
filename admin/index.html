<!-- ============================================================
     ADMIN-BEREICH — bg-naturfotografie.de/admin/
     ============================================================
     Hier bearbeitest du Termine, Motive, Geschichten, Texte und
     Shop-Preise in Formularen. Jede Speicherung landet direkt als
     Änderung im GitHub-Repo; nach 1–2 Minuten ist sie live.

     Die Seite ist nirgends verlinkt und für Suchmaschinen gesperrt
     (noindex + robots.txt). Geschützt ist sie aber nicht durch das
     Verstecken, sondern durch die Anmeldung: Ohne Schreibrecht auf
     dein GitHub-Repo kann hier niemand etwas speichern.

     Die Formulare selbst stehen in admin/config.yml.
     Das Programm dahinter ist Sveltia CMS (kostenlos, Open Source).
     Die Versionsnummer ist bewusst fest eingetragen, damit ein
     Update dort nicht plötzlich etwas hier verändert.
     ============================================================ -->
